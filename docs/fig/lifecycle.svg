<text x="754.0" y="83.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">fork</text>
<line x1="692.0" y1="92.0" x2="692.0" y2="486.0" stroke="#ecebe8" stroke-width="1"/>
<rect x="817.0" y="56.0" width="122.0" height="34.0" rx="3" fill="#f3f2ef" fill-opacity="1.0"/>
