<text x="506.0" y="83.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">generation</text>
<line x1="444.0" y1="92.0" x2="444.0" y2="426.0" stroke="#ecebe8" stroke-width="1"/>
