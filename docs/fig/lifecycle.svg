<text x="831.0" y="265.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="normal">≤ ~200 ms</text>
<text x="16.0" y="295.5" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Agree encoding randomness (rho)</text>
<rect x="775.0" y="281.0" width="112.0" height="20.0" rx="3" fill="#eb6834" fill-opacity="0.9"/>
<text x="831.0" y="295.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="normal">+1–2 rounds</text>
<text x="16.0" y="325.5" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">PRF shares → combine → publish</text>
<rect x="775.0" y="311.0" width="112.0" height="20.0" rx="3" fill="#eb6834" fill-opacity="0.9"/>
<text x="831.0" y="325.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="normal">~1.5 KiB / node</text>
<text x="16.0" y="355.5" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Never-sign-twice record per slot</text>
<rect x="775.0" y="341.0" width="466.0" height="20.0" rx="3" fill="#2a78d6" fill-opacity="0.9"/>
<text x="1008.0" y="355.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="normal">like a slashing DB</text>
