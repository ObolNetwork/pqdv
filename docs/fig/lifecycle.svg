<rect x="421.0" y="131.0" width="112.0" height="20.0" rx="3" fill="#2a78d6" fill-opacity="0.9"/>
<text x="477.0" y="145.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="normal">minutes; trust HW</text>
