<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="556" viewBox="0 0 1208 556" font-family="Helvetica, Arial, sans-serif">
<!-- Sources: EIP-8450, PRAWNS (ePrint 2026/2142), tools/cost_model.py - -primary -->
<rect x="0" y="0" width="1208" height="556" fill="#ffffff"/>
<text x="16.0" y="26.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">A distributed validator's life with EIP-8450 keys</text>
<text x="16.0" y="44.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">Columns are lifecycle stages (not to scale). Orange = on the critical path to signing; blue = background work.</text>
<rect x="321.0" y="56.0" width="122.0" height="34.0" rx="3" fill="#f3f2ef" fill-opacity="1.0"/>
<text x="382.0" y="70.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Cluster</text>
<text x="382.0" y="83.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">formation</text>
<line x1="320.0" y1="92.0" x2="320.0" y2="486.0" stroke="#ecebe8" stroke-width="1"/>
<rect x="445.0" y="56.0" width="122.0" height="34.0" rx="3" fill="#f3f2ef" fill-opacity="1.0"/>
<text x="506.0" y="70.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Register</text>
<text x="506.0" y="83.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">(EIP-8450)</text>
<line x1="444.0" y1="92.0" x2="444.0" y2="486.0" stroke="#ecebe8" stroke-width="1"/>
