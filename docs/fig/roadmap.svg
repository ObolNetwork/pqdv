<text x="425.6" y="519.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">off the critical path</text>
<rect x="562.8" y="510.0" width="14.0" height="10.0" rx="2" fill="#b9b8b2" fill-opacity="1.0"/>
