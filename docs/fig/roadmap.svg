<text x="16.0" y="159.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">SPEC ASKS (critical)</text>
<text x="16.0" y="185.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">rotation 12–18 mo, joint rho, records</text>
