<text x="428.3" y="263.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">lean devnet, real numbers</text>
<text x="16.0" y="289.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">public-table (cpk) storage + combiner</text>
<rect x="429.3" y="276.0" width="158.4" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="508.5" y="289.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">storage, prefetch</text>
<text x="16.0" y="315.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Boolean MPC keygen: 6-day key &lt; 1 h</text>
<rect x="397.2" y="302.0" width="222.6" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="508.5" y="315.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">BLAKE2s, 3–4 party, PRSS/DN07</text>
