<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="594" viewBox="0 0 1100 594" font-family="Helvetica, Arial, sans-serif">
<!-- Illustrative sequencing, not a commitment. -->
<rect x="0" y="0" width="1100" height="594" fill="#ffffff"/>
<text x="16.0" y="26.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">The road to post-quantum distributed validators (illustrative, months from now)</text>
<text x="16.0" y="44.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">Orange = critical path. Grey = Ethereum timelines we do not control. Durations are engineering estimates.</text>
<line x1="330.0" y1="58.0" x2="330.0" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="330.0" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">0 mo</text>
<line x1="422.5" y1="58.0" x2="422.5" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="422.5" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">3 mo</text>
<line x1="515.0" y1="58.0" x2="515.0" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="515.0" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">6 mo</text>
<line x1="607.5" y1="58.0" x2="607.5" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="607.5" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">9 mo</text>
<line x1="700.0" y1="58.0" x2="700.0" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="700.0" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">12 mo</text>
<line x1="792.5" y1="58.0" x2="792.5" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="792.5" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">15 mo</text>
<line x1="885.0" y1="58.0" x2="885.0" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="885.0" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">18 mo</text>
<line x1="977.5" y1="58.0" x2="977.5" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="977.5" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">21 mo</text>
<line x1="1070.0" y1="58.0" x2="1070.0" y2="506.0" stroke="#ecebe8" stroke-width="1"/>
<text x="1070.0" y="522.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="normal">24 mo</text>
<text x="16.0" y="81.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">ETHEREUM (external, dates unknown)</text>
<text x="16.0" y="107.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">EIP-8450 registry fork (after Heze)</text>
<rect x="331.0" y="94.0" width="738.0" height="18.0" rx="3" fill="#b9b8b2" fill-opacity="0.6"/>
<text x="700.0" y="107.2" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">Draft → devnets → mainnet; dormant keys</text>
<text x="16.0" y="133.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">switch fork: duties move to PQ keys</text>
<rect x="701.0" y="120.0" width="368.0" height="18.0" rx="3" fill="#b9b8b2" fill-opacity="0.6"/>
<text x="885.0" y="133.2" font-size="10" fill="#0b0b0b" text-anchor="middle" font-weight="normal">duty set, cadence, aggregation</text>
<text x="16.0" y="159.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">SPEC INPUT</text>
<text x="16.0" y="185.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">asks: dense allocation, outcome rule, replacement</text>
<rect x="331.0" y="172.0" width="183.0" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="422.5" y="185.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">EIP-8450 thread</text>
<text x="16.0" y="211.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">threshold profile for EIP-8310 keystores</text>
<rect x="361.8" y="198.0" width="152.2" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="437.9" y="211.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">with client teams</text>
<text x="16.0" y="237.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">BUILD: REGISTRATION</text>
<text x="16.0" y="263.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">charon: BLS-authorized registration</text>
<rect x="331.0" y="250.0" width="90.5" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="426.5" y="263.2" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">one-shot; dealer keys on devnets</text>
<text x="16.0" y="289.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">top-layer Keccak MPC + proof of possession</text>
<rect x="361.8" y="276.0" width="213.8" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="468.8" y="289.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">2^12 range; PRSS/DN07</text>
<text x="16.0" y="315.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">owner path in withdrawal contracts</text>
<rect x="423.5" y="302.0" width="152.2" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="499.6" y="315.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">PQ key authorization</text>
<text x="16.0" y="341.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">top-layer resharing</text>
<rect x="516.0" y="328.0" width="183.0" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="704.0" y="341.2" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">operator changes while dormant</text>
<text x="16.0" y="367.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">BUILD: SIGNING</text>
<text x="16.0" y="393.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">bottom-tree MPC + PRAWNS signing + leaf allocator</text>
<rect x="608.5" y="380.0" width="337.2" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="777.1" y="393.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">as the switch fork takes shape</text>
<text x="16.0" y="419.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">threshold two-layer proof; Lean proofs</text>
<rect x="454.3" y="406.0" width="368.0" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="638.3" y="419.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">PRAWNS + leanXMSS</text>
<text x="16.0" y="445.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">robustness / identifiable abort</text>
<rect x="577.7" y="432.0" width="244.7" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="700.0" y="445.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">evict a faulty node</text>
<text x="16.0" y="471.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">SHIP</text>
<text x="16.0" y="497.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">audit; register on devnets, then mainnet</text>
<rect x="577.7" y="484.0" width="183.0" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="765.7" y="497.2" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">ready for the registry fork</text>
<rect x="330.0" y="536.0" width="14.0" height="10.0" rx="2" fill="#eb6834" fill-opacity="1.0"/>
<text x="349.0" y="545.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">critical path</text>
<rect x="436.6" y="536.0" width="14.0" height="10.0" rx="2" fill="#2a78d6" fill-opacity="1.0"/>
<text x="455.6" y="545.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">off the critical path</text>
<rect x="592.8" y="536.0" width="14.0" height="10.0" rx="2" fill="#b9b8b2" fill-opacity="1.0"/>
<text x="611.8" y="545.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">external dependency</text>
</svg>
