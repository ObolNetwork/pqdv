<text x="16.0" y="393.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">robustness / identifiable abort</text>
<rect x="429.3" y="380.0" width="318.8" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="588.8" y="393.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">paper: none yet</text>
<text x="16.0" y="419.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">operator change without re-keying</text>
<rect x="493.5" y="406.0" width="383.0" height="18.0" rx="3" fill="#2a78d6" fill-opacity="1.0"/>
<text x="685.0" y="419.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">F_lat or new idea</text>
<text x="16.0" y="445.7" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">SHIP</text>
<text x="16.0" y="471.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">audit + production hardening</text>
<rect x="846.4" y="458.0" width="190.5" height="18.0" rx="3" fill="#eb6834" fill-opacity="1.0"/>
<text x="941.7" y="471.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">gated on the above</text>
<rect x="300.0" y="510.0" width="14.0" height="10.0" rx="2" fill="#eb6834" fill-opacity="1.0"/>
<text x="319.0" y="519.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">critical path</text>
