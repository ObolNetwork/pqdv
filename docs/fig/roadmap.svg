<text x="444.4" y="107.2" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">drifting to BLAKE (Flock-proven)</text>
<text x="16.0" y="133.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">lean consensus specs → PQ fork</text>
